##################################
# Pörssäri Home Assistant client #
##################################

# Settings parameters
input_text:
  porssari_mac:
    name: Pörssäri laitetunnus


# JSON-request from server (API v2)
rest:
  - resource_template: >
      {% set MAC = states('input_text.porssari_mac') if states('input_text.porssari_mac') | length > 10 else "HA_undefined" %}
      {% set md = state_attr("sensor.porssari_json_data", "metadata") %}
      {% if md %}
        {% set last_ts = md['timestamp'] | default(0) %}
        {% set fetch_url = md['fetch_url'] | default("https://api.porssari.fi/getcontrols.php") %}
      {% else %}
        {% set last_ts = 0 %}
        {% set fetch_url = "https://api.porssari.fi/getcontrols.php" %}
      {% endif %}
      {{ fetch_url }}?device_mac={{ MAC }}&last_request={{ last_ts }}&client=Homeassistant_1.0-rc1&json_version=2
    scan_interval: 604800
    sensor:
      - name: porssari_json
        value_template: "{{ value_json.metadata.timestamp | default(0) }}"
        json_attributes:
          - metadata
          - controls


# Lightweight "is there new data?" check
command_line:
  - sensor:
      name: porssari_request
      command: >-
        curl -o /dev/null -qsI -w "%{http_code}\n" "
        {%- set MAC = states("input_text.porssari_mac")|default("HA_undefined") -%}
        {%- set md = state_attr("sensor.porssari_json_data", "metadata") -%}
        {%- set last_ts = (md["timestamp"] if md and md["timestamp"] is defined else "0") -%}
        {%- set fetch_url = (md["fetch_url"] if md and md["fetch_url"] is defined else "https://api.porssari.fi/getcontrols.php") -%}
        {{ fetch_url }}?device_mac={{ MAC }}&last_request={{ last_ts }}&client=Homeassistant_1.0-rc1&json_version=2"
      scan_interval: 604800
      value_template: "{{ value }}"


template:
  # Cache sensor (sticky storage) for metadata + (attempted) controls
  # NOTE: controls may not be iterable in your HA version, so channel sensors use sensor.porssari_json directly.
  - sensor:
      - name: porssari_json_data
        state: >
          {% set md = state_attr("sensor.porssari_json_data", "metadata") %}
          {{ (md['timestamp'] if md else 0) | int }}
        attributes:
          metadata: >
            {{ state_attr("sensor.porssari_json", "metadata")
               if state_attr("sensor.porssari_json", "metadata")
               else state_attr("sensor.porssari_json_data", "metadata") }}
          controls: >
            {{ state_attr("sensor.porssari_json", "controls")
               if state_attr("sensor.porssari_json", "controls")
               else state_attr("sensor.porssari_json_data", "controls") }}

  - binary_sensor:
      - name: porssari_json_controls
        state: >
          {% set md = state_attr('sensor.porssari_json', 'metadata') %}
          {% if md and md['valid_until'] is defined %}
            {{ (md['valid_until'] | int) > (utcnow().timestamp() | int) }}
          {% else %}
            false
          {% endif %}

  - sensor:
      - name: "Pörssäri Channel 1 State"
        unique_id: porssari_ch1_state
        state: >
          {% set controls = state_attr('sensor.porssari_json', 'controls') %}
          {% if is_state('binary_sensor.porssari_json_controls', 'on') and controls %}
            {% set c = (controls | selectattr('id','equalto','1') | list | first) %}
            {% if c %}
              {% set nowts = utcnow().timestamp() | int %}
              {% set val = c['state'] | int %}
              {% set sched = c['schedules'] if c['schedules'] is defined and c['schedules'] else [] %}
              {% for s in (sched | sort(attribute='timestamp')) %}
                {% if (s['timestamp'] | int) <= nowts %}{% set val = (s['state'] | int) %}{% endif %}
              {% endfor %}
              {{ val }}
            {% else %}-1{% endif %}
          {% else %}-1{% endif %}

