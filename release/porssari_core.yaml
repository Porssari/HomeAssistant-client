##################################
# Pörssäri Home Assistant client #
##################################

# This file includes core functionalities. Do not edit this file.
# Add "Pörssäri laitetunnus" via Settings --> Devices & Services --> Helpers

# JSON-request from server
# One conditional GET replaces the old HEAD/curl check + separate JSON fetch.
# HTTP 200 updates the stored JSON. HTTP 304 keeps the previous state and attributes.
rest_command:
  porssari_fetch_json:
    url: >-
      {% set MAC = states('input_text.porssari_mac') if states('input_text.porssari_mac') | length > 10 else "HA_undefined" %}
      {% if state_attr("sensor.porssari_json_data", "metadata") %}
        {% set timestamp = state_attr("sensor.porssari_json_data", "metadata")['timestamp'] %}
        {% set fetch_url = state_attr("sensor.porssari_json_data", "metadata")['fetch_url'] %}
      {% else %}
        {% set timestamp = 0 %}
        {% set fetch_url = "https://api.porssari.fi/getcontrols.php" %}
      {% endif %}
      {{ fetch_url }}?device_mac={{ MAC }}&last_request={{ timestamp }}&client=Homeassistant_2.1&json_version=2
    method: GET

template:
  # Fetch and persist JSON data. The trigger-based template sensor restores its
  # previous state across restarts. A 304 response therefore causes no data loss.
  - triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    actions:
      - delay: "{{ range(30) | random }}"
      - action: rest_command.porssari_fetch_json
        response_variable: porssari_response
      - variables:
          porssari_data: >-
            {% if porssari_response.status == 200 %}
              {% if porssari_response.content is mapping %}
                {{ porssari_response.content }}
              {% else %}
                {{ porssari_response.content | from_json }}
              {% endif %}
            {% else %}
              {{ {} }}
            {% endif %}
    sensor:
      - name: porssari_json_data
        state: >
          {% set old_state = this.state if this.state not in ['unknown', 'unavailable', 'none'] else 0 %}
          {% if porssari_response.status == 200 and porssari_data is mapping %}
            {{ porssari_data.get('metadata', {}).get('timestamp', old_state) }}
          {% else %}
            {{ old_state }}
          {% endif %}
        attributes:
          metadata: >
            {% set old_metadata = this.attributes.get('metadata') %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('metadata', old_metadata) }}
            {% else %}
              {{ old_metadata }}
            {% endif %}
          controls: >
            {% set old_controls = this.attributes.get('controls', []) %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('controls', old_controls) }}
            {% else %}
              {{ old_controls }}
            {% endif %}

  # Sensors for Channel states.
  - sensor:
      - name: "Pörssäri Channel 1 State"
        unique_id: porssari_ch1_state
        state: >
          {% if is_state('binary_sensor.porssari_json_controls', 'on') %}
            {% set ns = namespace(state=-1) %}
            {% for item in state_attr("sensor.porssari_json_data", "controls") %}
              {% if item.id == '1' %}
                {% set ns.state = item.state %}
                {% for schedule in item.schedules %}
                  {% if as_datetime(schedule.timestamp) < now() %}
                    {% set ns.state = schedule.state %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.state }}
          {% else %}
            {{ -1 }}
          {% endif %}
