# This file includes core functionalities. Do not edit this file.
# Sensors based on Pörssari json data are included in porssari_sensors.yaml

# JSON-request from server
# One conditional GET replaces the old HEAD/curl check + separate JSON fetch.
# HTTP 200 updates the stored JSON. HTTP 304 keeps the previous state and attributes.
rest_command:
  porssari_fetch_json_dev:
    url: >-
      {% set MAC = states('input_text.porssari_mac_dev') if states('input_text.porssari_mac_dev') | length > 10 else "HA_undefined" %}
      {% if state_attr("sensor.porssari_json_data_dev", "metadata") %}
        {% set timestamp = state_attr("sensor.porssari_json_data_dev", "metadata").get('timestamp', 0) %}
        {% set fetch_url = state_attr("sensor.porssari_json_data_dev", "metadata").get('fetch_url', 'https://api.porssari.fi/getcontrols.php') %}
      {% else %}
        {% set timestamp = 0 %}
        {% set fetch_url = "https://api.porssari.fi/getcontrols.php" %}
      {% endif %}
      {% set client_fw = state_attr("update.home_assistant_core_update", "installed_version") | default("", true) %}
      {{ fetch_url }}?device_mac={{ MAC }}&last_request={{ timestamp }}&client=Homeassistant_2.1-dev{% if client_fw not in ["unknown", "unavailable", ""] %}&client_fw={{ client_fw | urlencode }}{% endif %}&json_version=2&json_channel_names=true&prices=true
    method: GET

template:
  # Fetch and persist JSON data. The trigger-based template sensor restores its
  # previous state across restarts. A 304 response therefore causes no data loss.
  - triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    actions:
      - delay: "{{ range(30) | random }}"
      - action: rest_command.porssari_fetch_json_dev
        response_variable: porssari_response
      - variables:
          porssari_data: >-
            {% if porssari_response.status == 200 %}
              {% if porssari_response.content is mapping %}
                {{ porssari_response.content }}
              {% else %}
                {{ porssari_response.content | from_json }}
              {% endif %}
            {% else %}
              {{ {} }}
            {% endif %}
    sensor:
      - name: porssari_json_data_dev
        state: >
          {% set old_state = this.state if this.state not in ['unknown', 'unavailable', 'none'] else 0 %}
          {% if porssari_response.status == 200 and porssari_data is mapping %}
            {{ porssari_data.get('metadata', {}).get('timestamp', old_state) }}
          {% else %}
            {{ old_state }}
          {% endif %}
        attributes:
          metadata: >
            {% set old_metadata = this.attributes.get('metadata') %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('metadata', old_metadata) }}
            {% else %}
              {{ old_metadata }}
            {% endif %}
          controls: >
            {% set old_controls = this.attributes.get('controls', []) %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('controls', old_controls) }}
            {% else %}
              {{ old_controls }}
            {% endif %}
          prices: >
            {% set old_prices = this.attributes.get('prices', {}) %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('prices', old_prices) }}
            {% else %}
              {{ old_prices }}
            {% endif %}
          ch_data: >
            {% set old_ch_data = this.attributes.get('ch_data', []) %}
            {% if porssari_response.status == 200 and porssari_data is mapping %}
              {{ porssari_data.get('ch_data', porssari_data.get('controls', old_ch_data)) }}
            {% else %}
              {{ old_ch_data }}
            {% endif %}

  # Sensors for Channel states.
  - sensor:
      - name: "porssari_dev_channel_1_state"
        unique_id: porssari_dev_ch1_state
        state: >
          {% if is_state('binary_sensor.porssari_json_controls_dev', 'on') %}
            {% set ns = namespace(state=-1) %}
            {% for item in state_attr("sensor.porssari_json_data_dev", "controls") | default([], true) %}
              {% if item.id | string == '1' %}
                {% set ns.state = item.state %}
                {% for schedule in item.schedules | default([], true) %}
                  {% if as_datetime(schedule.timestamp) < now() %}
                    {% set ns.state = schedule.state %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.state }}
          {% else %}
            {{ -1 }}
          {% endif %}
        attributes:
          channel_id: 1
          channel_name: >
            {% set ns = namespace(name='') %}
            {% for item in state_attr("sensor.porssari_json_data_dev", "controls") | default([], true) %}
              {% if item.id | string == '1' %}
                {% set ns.name = item.name | default('', true) %}
              {% endif %}
            {% endfor %}
            {{ ns.name }}
          failsafe: >
            {% set ns = namespace(failsafe=[]) %}
            {% for item in state_attr("sensor.porssari_json_data_dev", "controls") | default([], true) %}
              {% if item.id | string == '1' and item.failsafe is defined and item.failsafe is not none %}
