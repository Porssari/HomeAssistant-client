          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and is_number(priceNow) and is_number(avgToday) and is_number(sdToday) %}
            {{ priceNow | float(0) < (avgToday | float(0) + sdFactor * sdToday | float(0)) }}
          {% else %}
            {{ false }}
          {% endif %}
      - name: Porssari_dev_price_under_avg_minus1SD
        state: >
          {% set sdFactor = -1 %}
          {% set priceNow = states("sensor.porssari_dev_price_now") %}
          {% set avgToday = states("sensor.porssari_dev_avg_today") %}
          {% set sdToday = states("sensor.porssari_dev_price_today_sd") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and is_number(priceNow) and is_number(avgToday) and is_number(sdToday) %}
            {{ priceNow | float(0) < (avgToday | float(0) + sdFactor * sdToday | float(0)) }}
          {% else %}
            {{ false }}
          {% endif %}

  - sensor:
      - name: Porssari_dev_hours_under_sdfactor_0
        state: >
          {% set minHours = 0 %}
          {% set maxHours = 24 %}
          {% set sdFactor = 0 %}
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% set meanPrice = states("sensor.porssari_dev_avg_today") %}
          {% set sdPrice = states("sensor.porssari_dev_price_today_sd") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping and is_number(meanPrice) and is_number(sdPrice) %}
            {% set cutoffPrice = meanPrice | float(0) + (sdFactor * sdPrice | float(0)) %}
            {% set ns = namespace(hours=[]) %}
            {% for item in prices | list %}
              {% if now().day == as_datetime(item).day and prices[item].get('total_price', 0) | float(0) <= cutoffPrice %}
                {% set ns.hours = ns.hours + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ minHours if ns.hours | length < minHours else maxHours if ns.hours | length > maxHours else ns.hours | length }}
          {% else %}
            {{ minHours }}
          {% endif %}
