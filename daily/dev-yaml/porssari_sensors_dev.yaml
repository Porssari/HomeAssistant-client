################################################################
# Pörssäri Home Assistant client sensors - DEVELOPMENT VERSION #
#                                                              #
# Do not use this file if you don't have access to             #
# development features in Pörssäri service                     #
################################################################

template:
  # Pörssäri price sensors
  - sensor:
      - name: porssari_dev_price_now
        unique_id: porssari_dev_price_now
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        attributes:
          friendly_name: "Pörssäri dev sähkön hinta nyt"
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% set curHour = now().strftime('%Y-%m-%dT%H:00:00%z') | string %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping and curHour in prices %}
            {{ prices[curHour].get('total_price', 0) | float(0) }}
          {% else %}
            {{ 0 }}
          {% endif %}
      - name: porssari_dev_spot_raw_price_now
        unique_id: porssari_dev_spot_raw_price_now
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        attributes:
          friendly_name: "Pörssäri dev sähkön spot-hinta nyt"
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% set curHour = now().strftime('%Y-%m-%dT%H:00:00%z') | string %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping and curHour in prices %}
            {{ prices[curHour].get('spot_price', 0) | float(0) }}
          {% else %}
            {{ 0 }}
          {% endif %}
      - name: porssari_dev_price_now_eur
        unique_id: porssari_dev_price_now_eur
        unit_of_measurement: "eur/kWh"
        device_class: monetary
        attributes:
          friendly_name: "Pörssäri dev sähkön hinta nyt (eur)"
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% set curHour = now().strftime('%Y-%m-%dT%H:00:00%z') | string %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping and curHour in prices %}
            {{ prices[curHour].get('total_price', 0) | float(0) / 100 }}
          {% else %}
            {{ 0 }}
          {% endif %}
      - name: porssari_dev_avg_today
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
            {% set ns = namespace(prices=[]) %}
            {% for item in prices | list %}
              {% if now().day == as_datetime(item).day %}
                {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.prices | average | float(0) | round(2) if ns.prices | length >= 23 else 0 }}
          {% else %}
            {{ 0 }}
          {% endif %}
      - name: porssari_dev_avg_tomorrow
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
            {% set tomorrow = now() + timedelta(days=1) %}
            {% set ns = namespace(prices=[]) %}
            {% for item in prices | list %}
              {% if tomorrow.day == as_datetime(item).day %}
                {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.prices | average | float(0) | round(2) if ns.prices | length >= 23 else 0 }}
          {% else %}
            {{ 0 }}
          {% endif %}
      - name: porssari_dev_min_today
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
            {% set ns = namespace(prices=[]) %}
            {% for item in prices | list %}
              {% if now().day == as_datetime(item).day %}
                {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.prices | min | float(0) if ns.prices | length >= 23 else 0 }}
          {% else %}
            {{ 0 }}
          {% endif %}
        attributes:
          Hour: >
            {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
            {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
              {% set ns = namespace(ts=[], prices=[], hours=[]) %}
              {% for item in prices | list %}
                {% if now().day == as_datetime(item).day %}
                  {% set ns.ts = ns.ts + [item] %}
                  {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
                {% endif %}
              {% endfor %}
              {% if ns.prices | length > 0 %}
                {% set pmin = ns.prices | min | float(0) %}
                {% for item in ns.ts %}
                  {% if prices[item].get('total_price', 0) | float(0) == pmin %}
                    {% set ns.hours = ns.hours + [as_datetime(item).hour | int(0)] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.hours }}
            {% else %}
              {{ 0 }}
            {% endif %}
      - name: porssari_dev_max_today
        unit_of_measurement: "snt/kWh"
        device_class: monetary
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
            {% set ns = namespace(prices=[]) %}
            {% for item in prices | list %}
              {% if now().day == as_datetime(item).day %}
                {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.prices | max | float(0) if ns.prices | length >= 23 else 0 }}
          {% else %}
            {{ 0 }}
          {% endif %}
        attributes:
          Hour: >
            {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
            {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
              {% set ns = namespace(ts=[], prices=[], hours=[]) %}
              {% for item in prices | list %}
                {% if now().day == as_datetime(item).day %}
                  {% set ns.ts = ns.ts + [item] %}
                  {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
                {% endif %}
              {% endfor %}
              {% if ns.prices | length > 0 %}
                {% set pmax = ns.prices | max | float(0) %}
                {% for item in ns.ts %}
                  {% if prices[item].get('total_price', 0) | float(0) == pmax %}
                    {% set ns.hours = ns.hours + [as_datetime(item).hour | int(0)] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.hours }}
            {% else %}
              {{ 0 }}
            {% endif %}
      - name: porssari_dev_price_today_sd
        state: >
          {% set prices = state_attr("sensor.porssari_json_data_dev", "prices") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and prices is mapping %}
            {% set ns = namespace(prices=[], values=[]) %}
            {% for item in prices | list %}
              {% if now().day == as_datetime(item).day %}
                {% set ns.prices = ns.prices + [prices[item].get('total_price', 0) | float(0)] %}
              {% endif %}
            {% endfor %}
            {% if ns.prices | length > 0 %}
              {% set mean = ns.prices | average | float(0) | round(2) %}
              {% for value in ns.prices %}
                {% set ns.values = ns.values + [(value - mean) ** 2] %}
              {% endfor %}
              {{ sqrt(ns.values | sum / (ns.values | length)) | round(2) }}
            {% else %}
              {{ 0 }}
            {% endif %}
          {% else %}
            {{ 0 }}
          {% endif %}

  - binary_sensor:
      - name: Porssari_dev_price_under_avg
        state: >
          {% set sdFactor = 0 %}
          {% set priceNow = states("sensor.porssari_dev_price_now") %}
          {% set avgToday = states("sensor.porssari_dev_avg_today") %}
          {% set sdToday = states("sensor.porssari_dev_price_today_sd") %}
          {% if is_state('binary_sensor.porssari_json_prices_dev', 'on') and is_number(priceNow) and is_number(avgToday) and is_number(sdToday) %}
            {{ priceNow | float(0) < (avgToday | float(0) + sdFactor * sdToday | float(0)) }}
          {% else %}
            {{ false }}
          {% endif %}
      - name: Porssari_dev_price_under_avg_plus1SD
        state: >
          {% set sdFactor = 1 %}
          {% set priceNow = states("sensor.porssari_dev_price_now") %}
